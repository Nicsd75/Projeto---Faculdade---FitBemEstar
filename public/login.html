<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyHealth - Acesso do Aluno</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-box {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        width: 100%;
        max-width: 420px;
        padding: 36px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }

      .login-box h1 {
        font-size: 24px;
        color: #38bdf8;
        text-align: center;
        margin-bottom: 8px;
      }

      .login-box p {
        color: #94a3b8;
        font-size: 14px;
        text-align: center;
        margin-bottom: 28px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #cbd5e1;
      }

      input {
        width: 100%;
        background: #0f172a;
        border: 1px solid #334155;
        color: #fff;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #38bdf8;
      }

      .btn-entrar {
        width: 100%;
        background: #0284c7;
        color: white;
        border: none;
        padding: 13px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }

      .btn-entrar:hover {
        background: #0369a1;
      }

      .cadastro-link {
        text-align: center;
        margin-top: 22px;
        font-size: 13px;
        color: #94a3b8;
      }

      .cadastro-link a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
      }

      .cadastro-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Espaço Fitness</h1>
      <p>Acesse com seu e-mail cadastrado</p>

      <!-- Formulário que envia estritamente para validação -->
      <form action="/login-endpoint" method="POST">
        <div class="form-group">
          <label for="email">E-mail Cadastrado</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-entrar">ENTRAR NO SISTEMA</button>
      </form>

      <div class="cadastro-link">
        Ainda não é cadastrado? <a href="/cadastro.html">Cadastre-se aqui</a>
      </div>
    </div>
  </body>
</html>
