<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitBemEstar - Cadastro de Aluno</title>
    <style>
      :root {
        --primary: #4361ee;
        --primary-hover: #3a0ca3;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --success: #10b981;
        --error: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        width: 100%;
        max-width: 520px;
        padding: 36px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .header h1 {
        font-size: 26px;
        color: #fff;
        font-weight: 700;
      }

      .header p {
        color: var(--text-muted);
        font-size: 14px;
        margin-top: 6px;
      }

      .alert {
        display: none;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
      }

      .alert-error {
        background-color: rgba(239, 68, 68, 0.15);
        border: 1px solid var(--error);
        color: #fca5a5;
      }

      .alert-success {
        background-color: rgba(16, 185, 129, 0.15);
        border: 1px solid var(--success);
        color: #6ee7b7;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #cbd5e1;
      }

      input,
      select,
      textarea {
        width: 100%;
        background: #0f172a;
        border: 1px solid var(--border);
        color: #fff;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.25);
      }

      button.btn-submit {
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }

      button.btn-submit:hover {
        background: var(--primary-hover);
      }

      button.btn-submit:disabled {
        background: var(--border);
        cursor: not-allowed;
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .footer a {
        color: #818cf8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>EasyHealth</h1>
        <p>Cadastre um novo aluno no sistema</p>
      </div>

      <!-- Caixa de Mensagens -->
      <div id="alertBox" class="alert"></div>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="nome">Nome Completo *</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex: Lucas Silva"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="aluno@email.com"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="senha">Senha *</label>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="form-group">
            <label for="nascimento">Nascimento *</label>
            <input type="date" id="nascimento" name="nascimento" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="peso">Peso Inicial (kg)</label>
            <input
              type="number"
              id="peso"
              name="peso"
              step="0.1"
              placeholder="Ex: 75.5"
            />
          </div>
          <div class="form-group">
            <label for="objetivo">Objetivo Principal</label>
            <select id="objetivo" name="objetivo">
              <option value="Hipertrofia">Ganho de Massa (Hipertrofia)</option>
              <option value="Emagrecimento">
                Perda de Gordura / Emagrecimento
              </option>
              <option value="Condicionamento Físico">
                Condicionamento Físico Geral
              </option>
              <option value="Saúde e Reabilitação">Saúde e Reabilitação</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="observacoes">Observações ou Restrições</label>
          <textarea
            id="observacoes"
            name="observacoes"
            rows="2"
            placeholder="Ex: Problema no joelho esquerdo, foco em cardio..."
          ></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          Realizar Matrícula
        </button>
      </form>

      <div class="footer">
        Já possui uma conta? <a href="/login.html">Ir para Login</a>
      </div>
    </div>

    <script>
      const form = document.getElementById('cadastroForm')
      const alertBox = document.getElementById('alertBox')
      const btnSubmit = document.getElementById('btnSubmit')

      function showAlert(message, type) {
        alertBox.textContent = message
        alertBox.className = `alert alert-${type}`
        alertBox.style.display = 'block'
      }

      form.addEventListener('submit', async e => {
        e.preventDefault()
        alertBox.style.display = 'none'
        btnSubmit.disabled = true
        btnSubmit.textContent = 'Salvando no banco...'

        // Monta o objeto com os dados digitados
        const payload = {
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
          nascimento: document.getElementById('nascimento').value,
          peso: document.getElementById('peso').value,
          objetivo: document.getElementById('objetivo').value,
          observacoes: document.getElementById('observacoes').value
        }

        try {
          const response = await fetch('/api/cadastro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })

          const data = await response.json()

          if (response.ok && data.sucesso) {
            showAlert(
              'Cadastro realizado com sucesso! Redirecionando...',
              'success'
            )
            setTimeout(() => {
              window.location.href = data.redirectUrl || '/login.html'
            }, 1500)
          } else {
            showAlert(data.mensagem || 'Erro ao realizar cadastro.', 'error')
            btnSubmit.disabled = false
            btnSubmit.textContent = 'Realizar Matrícula'
          }
        } catch (err) {
          showAlert(
            'Não foi possível conectar ao servidor. Verifique se o terminal está ativo.',
            'error'
          )
          btnSubmit.disabled = false
          btnSubmit.textContent = 'Realizar Matrícula'
        }
      })
    </script>
  </body>
</html>
