<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso ao Sistema</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
      }
      .login-container {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      .login-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333333;
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #666666;
        font-size: 0.9em;
      }
      .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        font-size: 1em;
      }
      .input-group input:focus {
        outline: none;
        border-color: #0056b3;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #0056b3;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1em;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #004494;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Entrar</h2>
      <!-- action direcionando direto para a página de sucesso -->
      <form action="index.html" method="GET">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          />
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="input-group">
          <label for="nascimento">Data de Nascimento</label>
          <input
            type="date"
            id="nascimento"
            name="nascimento"
            min="1950-01-01"
            max="2026-12-31"
            required
          />
        </div>

        <button type="submit">Acessar</button>
      </form>
    </div>
  </body>
</html>
